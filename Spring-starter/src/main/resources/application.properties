spring.application.name=Spring-starter
spring.h2.console.enabled=true
# Local learning database: app band/restart hone par in-memory data reset hota hai.
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Entity mappings ke basis par development schema maintain karo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
