name: Deploy Spring Boot API to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - 'springboot2026 2/**'
      - '.github/workflows/deploy-cloud-run.yml'
  pull_request:
    branches: [master]
    paths:
      - 'springboot2026 2/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and container
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Use the same Java major version as the local project and cache Gradle dependencies.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            springboot2026 2/build.gradle
            springboot2026 2/gradle/wrapper/gradle-wrapper.properties

      # Runs the existing tests and creates the executable application jar.
      - name: Run tests and build the application
        run: ./gradlew --no-daemon clean test bootJar
        working-directory: springboot2026 2

      # Catch Dockerfile and container packaging problems before a cloud deployment.
      - name: Build the Docker image
        run: docker build --tag springboot2026-api:ci .
        working-directory: springboot2026 2

  deploy:
    name: Deploy to Cloud Run
    needs: verify
    # Pull requests must pass verification but never deploy to the cloud.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # GitHub gets short-lived Google credentials through Workload Identity Federation.
      # Configure these repository variables in GitHub before running this workflow.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # Cloud Build builds the Dockerfile in the application folder; Cloud Run serves it.
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}"
          --source "./springboot2026 2"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --allow-unauthenticated
          --port 8080
          --memory 1Gi
          --cpu 1
          --min 0
          --max 1
          --quiet
