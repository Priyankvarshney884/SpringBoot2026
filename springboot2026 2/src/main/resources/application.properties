spring.application.name=springboot2026

# H2 is an in-memory learning database: its data is reset when the app stops.
spring.datasource.url=jdbc:h2:mem:springboot2026
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=PriynkBook

# Create/update tables for this disposable POC only; use migrations for real databases.
spring.jpa.hibernate.ddl-auto=update
# Force API code to map DTOs inside service transactions instead of lazy-loading in web code.
spring.jpa.open-in-view=false

# Cap requests such as ?size=100000 so a client cannot ask the API for an unbounded page.
spring.data.web.pageable.max-page-size=100
